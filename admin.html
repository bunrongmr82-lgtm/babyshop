<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>LK Bot System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f7fb; --card:#fff; --line:#e6e8ef; --text:#1d2433; --muted:#6b7385; --accent:#e94e7d; --accent-soft:#fde8ef;
    --ok:#1f9d63; --ok-soft:#e3f6ec; --warn:#c98a00; --warn-soft:#fff4d6; --bad:#d33b3b; --bad-soft:#fde6e6; --info:#2f6fde; --info-soft:#e6eefc; --r:14px; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font-family:'Kantumruy Pro',system-ui,sans-serif; font-size:15px; }
  [hidden] { display:none !important; }
  button,input,select,textarea { font:inherit; }
  a { color:var(--info); }
  .btn { border:0; border-radius:10px; padding:10px 16px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:#fff; color:var(--text); border:1px solid var(--line); }
  .btn.ok { background:var(--ok); } .btn.bad { background:var(--bad); } .btn.sm { padding:6px 12px; font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .grow { flex:1; }
  input,select,textarea { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fff; color:var(--text); outline:none; }
  input:focus,select:focus,textarea:focus { border-color:var(--accent); }
  textarea { min-height:140px; resize:vertical; line-height:1.6; }
  label.f { display:block; font-size:13px; color:var(--muted); margin:10px 0 6px; }
  .hint { font-size:13px; color:var(--muted); line-height:1.6; }

  /* login */
  .login { min-height:100vh; display:grid; place-items:center; padding:20px; }
  .login .box { width:100%; max-width:380px; background:#fff; border-radius:20px; padding:28px; box-shadow:0 10px 40px rgba(20,30,60,.08); }
  .logo { width:44px; height:44px; border-radius:12px; background:var(--accent); display:grid; place-items:center; color:#fff; font-size:22px; }
  .login h1 { font-size:20px; margin:14px 0 4px; }
  .err { color:var(--bad); font-size:13px; margin-top:10px; white-space:pre-line; }

  /* layout */
  .top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:12px; }
  .top .who { margin-left:auto; font-size:13px; color:var(--muted); text-align:right; }
  .wrap { display:flex; min-height:calc(100vh - 61px); }
  nav { width:210px; flex:none; background:#fff; border-right:1px solid var(--line); padding:12px 8px; }
  nav button { display:flex; width:100%; align-items:center; gap:10px; padding:10px 12px; border:0; background:none; border-radius:10px; color:var(--text); cursor:pointer; text-align:left; }
  nav button.on { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  nav .badge { margin-left:auto; background:var(--accent); color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; }
  main { flex:1; padding:20px; max-width:1200px; min-width:0; }
  .sk { background:#eceef4; border-radius:10px; }
  .sk-h { height:22px; width:180px; margin-bottom:16px; }
  .sk-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .sk-k { height:74px; } .sk-card { height:180px; }
  .more-list button { display:flex; width:100%; gap:10px; padding:14px 8px; border:0; border-bottom:1px solid var(--line); background:none; font-size:15px; cursor:pointer; text-align:left; }
  @media (max-width: 820px) {
    .wrap { display:block; }
    nav { width:auto; position:fixed; left:0; right:0; bottom:0; z-index:10; display:grid; grid-template-columns:repeat(5,1fr); border-right:0; border-top:1px solid var(--line);
      padding:4px 2px calc(4px + env(safe-area-inset-bottom)); background:#fff; }
    nav button { flex-direction:column; gap:2px; padding:6px 2px; font-size:11px; text-align:center; justify-content:center; position:relative; }
    nav button .ic { font-size:20px; line-height:1; }
    nav .badge { position:absolute; top:2px; right:14%; margin:0; }
    main { padding:14px 14px 84px; }
    .top .who a { display:none; }
  }
  h2 { font-size:19px; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:16px; }
  .card h3 { margin:0 0 12px; font-size:16px; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:16px; }
  .kpi { background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:14px; cursor:default; }
  .kpi .v { font-size:24px; font-weight:700; margin-top:4px; }
  .kpi .l { font-size:13px; color:var(--muted); }
  .kpi.click { cursor:pointer; } .kpi.click:hover { border-color:var(--accent); }
  .tbl { width:100%; border-collapse:collapse; font-size:14px; }
  .tbl th { text-align:left; color:var(--muted); font-weight:600; font-size:12.5px; padding:8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .tbl td { padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  .tbl tr.click { cursor:pointer; } .tbl tr.click:hover td { background:#fafbff; }
  .scroll { overflow-x:auto; }
  .num { text-align:right; white-space:nowrap; }
  .chip { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
  .c-ok { background:var(--ok-soft); color:var(--ok); } .c-warn { background:var(--warn-soft); color:var(--warn); }
  .c-bad { background:var(--bad-soft); color:var(--bad); } .c-info { background:var(--info-soft); color:var(--info); }
  .c-mute { background:#eef0f5; color:var(--muted); } .c-acc { background:var(--accent-soft); color:var(--accent); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tabs button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .lines .line { display:grid; grid-template-columns: 1fr 90px 110px 34px; gap:8px; margin-bottom:8px; }
  .x { border:0; background:#f1f2f6; border-radius:8px; cursor:pointer; }
  .total { font-size:18px; font-weight:700; }
  .bc { border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:#fff; }
  .bc .txt { white-space:pre-wrap; font-size:14px; color:#333; margin:8px 0; max-height:120px; overflow:hidden; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .thumbs .t { position:relative; width:72px; height:72px; border-radius:10px; overflow:hidden; background:#eee; display:grid; place-items:center; font-size:12px; color:var(--muted); }
  .thumbs .t img { width:100%; height:100%; object-fit:cover; }
  .thumbs .t button { position:absolute; top:2px; right:2px; border:0; border-radius:50%; width:22px; height:22px; background:rgba(0,0,0,.6); color:#fff; cursor:pointer; }
  .checks { display:flex; flex-wrap:wrap; gap:6px; max-height:180px; overflow:auto; padding:4px 0; }
  .checks label { border:1px solid var(--line); border-radius:999px; padding:5px 10px; font-size:13px; cursor:pointer; display:flex; gap:6px; align-items:center; background:#fff; }
  .checks input { width:auto; }
  .modal-bg { position:fixed; inset:0; background:rgba(15,20,35,.45); z-index:20; display:grid; place-items:center; padding:16px; }
  .modal { background:#fff; border-radius:18px; width:100%; max-width:520px; max-height:90vh; overflow:auto; padding:20px; }
  .modal h3 { margin:0 0 6px; }
  .pinbox { font-size:30px; font-weight:700; letter-spacing:6px; text-align:center; padding:14px; background:var(--accent-soft); color:var(--accent); border-radius:12px; margin:12px 0; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1d2433; color:#fff; padding:10px 16px; border-radius:12px; z-index:30; opacity:0; transition:opacity .2s; pointer-events:none; max-width:92vw; white-space:pre-line; }
  #toast.show { opacity:1; }
  .prev { white-space:pre-wrap; background:#f7f8fc; border:1px dashed var(--line); border-radius:10px; padding:10px 12px; font-size:14px; margin-top:8px; }
  .warn { color:var(--bad); background:var(--bad-soft); border-radius:10px; padding:8px 12px; font-size:13px; margin-top:8px; }
  .kpi .s { font-size:12px; color:var(--muted); margin-top:3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; } @media (max-width: 820px) { .grid2 { grid-template-columns:1fr; } }
  .hb { display:grid; grid-template-columns:minmax(80px,38%) 1fr 40px; gap:8px; align-items:center; margin:7px 0; font-size:13.5px; }
  .hb-l { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .hb-n { text-align:right; color:var(--muted); }
  .hb-t { background:#f1f2f6; border-radius:6px; height:12px; overflow:hidden; } .hb-t div { background:var(--accent); height:100%; border-radius:6px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; } .filters > * { width:auto; flex:1 1 150px; }
  .selbar { position:sticky; bottom:12px; z-index:6; display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#1d2433; color:#fff; border-radius:14px; padding:12px 14px; box-shadow:0 8px 30px rgba(20,30,60,.25); }
  .selbar b { color:#fff; } @media (max-width: 820px) { .selbar { bottom:80px; } }
  .step { margin:22px 0 4px; font-weight:700; color:var(--accent); border-top:1px dashed var(--line); padding-top:14px; }
  .vars { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; } .vars button { border:1px dashed var(--accent); background:var(--accent-soft); color:var(--accent); border-radius:8px; padding:3px 9px; font-size:12.5px; cursor:pointer; }
  .ai { background:linear-gradient(180deg,#fff7fb,#fff); border:1px solid #f6cfdd; border-radius:12px; padding:10px 12px; margin-top:10px; }
  .prods label { gap:6px; } .prods img { width:26px; height:26px; border-radius:6px; object-fit:cover; }
  .sumbox { background:#f7f8fc; border-radius:10px; padding:10px 12px; font-size:13.5px; margin-top:8px; }
  .banner { display:flex; gap:10px; align-items:center; background:var(--warn-soft); border:1px solid #f1d58a; border-radius:12px; padding:12px 14px; margin-bottom:14px; }
  .banner.ok { background:var(--ok-soft); border-color:#b7e4cb; }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  .pc { border:1px solid var(--line); border-radius:12px; overflow:hidden; cursor:pointer; background:#fff; } .pc:hover { border-color:var(--accent); } .pc.off { opacity:.55; }
  .pc img, .pc .noimg { width:100%; aspect-ratio:1/1; object-fit:cover; display:grid; place-items:center; background:#f7f8fc; font-size:40px; }
  .pc .pb { padding:8px 10px 10px; font-size:13.5px; }
  .thumbs .t.big { width:96px; height:96px; } .thumbs .t .star { left:2px; right:auto; background:rgba(201,138,0,.85); }
  .thumbs .t .main { position:absolute; left:2px; bottom:2px; background:var(--accent); color:#fff; font-size:10px; border-radius:6px; padding:1px 6px; }
  .empty { color:var(--muted); padding:18px; text-align:center; }
  .spin { display:inline-block; width:16px; height:16px; border:2px solid #ddd; border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; vertical-align:middle; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="vLogin" hidden>
  <div class="box">
    <div class="logo">👶</div>
    <h1>LK Bot System</h1>
    <div class="hint">ចូលដោយ System ID និង PIN ៦ ខ្ទង់</div>
    <form id="fLogin" autocomplete="off">
      <label class="f" for="lSid">System ID</label>
      <input id="lSid" placeholder="ឧ. A001 ឬ S002" maxlength="6" autocapitalize="characters" required>
      <label class="f" for="lPin">PIN</label>
      <input id="lPin" type="password" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="••••••" required>
      <div class="err" id="lErr"></div>
      <div style="height:14px"></div>
      <button class="btn" style="width:100%" id="lBtn">ចូល</button>
    </form>
  </div>
</section>

<!-- CHANGE PIN (forced) -->
<section class="login" id="vPin" hidden>
  <div class="box">
    <div class="logo">🔐</div>
    <h1>ប្តូរ PIN</h1>
    <div class="hint">នេះជាការចូលលើកដំបូង ឬ PIN ត្រូវបាន Reset។ សូមកំណត់ PIN ថ្មី ៦ ខ្ទង់ ដែលមានតែអ្នកដឹង។</div>
    <form id="fPin" autocomplete="off">
      <label class="f">PIN បច្ចុប្បន្ន</label><input id="pOld" type="password" inputmode="numeric" maxlength="6" required>
      <label class="f">PIN ថ្មី</label><input id="pNew" type="password" inputmode="numeric" maxlength="6" required>
      <label class="f">បញ្ជាក់ PIN ថ្មី</label><input id="pNew2" type="password" inputmode="numeric" maxlength="6" required>
      <div class="err" id="pErr"></div>
      <div style="height:14px"></div>
      <button class="btn" style="width:100%">រក្សាទុក PIN ថ្មី</button>
    </form>
  </div>
</section>

<!-- APP -->
<section id="vApp" hidden>
  <div class="top">
    <div class="logo" style="width:34px;height:34px;font-size:18px">👶</div>
    <b>LK Bot System</b>
    <div class="who"><div id="whoName"></div><a href="#" id="btnLogout">ចាកចេញ</a></div>
  </div>
  <div class="wrap">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</section>

<div id="modalRoot"></div>
<div id="toast"></div>

<script>
(function () {
  'use strict';
  var DEFAULT_API = 'https://script.google.com/macros/s/AKfycbzzViO_wPc9_ukYjKOgW2-ZEyk8_InMKy6L33OAA9UYI1ub1FL3VjOJ1lKxN9UfiOIh/exec';
  var qApi = new URLSearchParams(location.search).get('api');
  var API = qApi && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(qApi) ? qApi : DEFAULT_API;

  var S = { cache: {}, refresh: null, token: null, user: null, view: 'overview', stores: [], sales: [], products: [], templates: [], summary: null, edit: null };
  var $ = function (id) { return document.getElementById(id); };
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { var x = Number(n); return isFinite(x) ? '$' + x.toFixed(2) : 'N/A'; }
  function today() { var d = new Date(Date.now() + 7 * 3600e3); return d.toISOString().slice(0, 10); }
  function addDays(d, n) { return new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 3000); }
  function store(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
  var isAdmin = function () { return S.user && S.user.role === 'ADMIN'; };

  function api(action, data) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
      body: JSON.stringify({ action: action, token: S.token, data: data || {} }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        if (!READS.test(action)) S.cache = {}; // any change → fresh data everywhere
        if (!j.ok && j.error === 'auth') { logout(true); throw new Error(j.message); }
        if (!j.ok && j.error === 'must_change') { showPin(); throw new Error(j.message); }
        return j;
      });
  }
  var READS = /^adm\.(login|me|boot|summary|stores\.list|products\.list|templates\.list|orders\.list|stock\.store|stock\.warehouse|po\.list|bc\.list|users\.list|report\.excel)$/;
  /** Stale-while-revalidate: draw cached data at once, refresh in the background, redraw only if it changed. */
  function swr(action, data, render) {
    var key = action + JSON.stringify(data || {}), c = S.cache[key], view = S.view;
    if (c) render(c.v, true);
    if (c && Date.now() - c.t < 15000) return Promise.resolve(c.v);
    return api(action, data).then(function (j) {
      S.cache[key] = { t: Date.now(), v: j };
      if (S.view === view && (!c || JSON.stringify(c.v) !== JSON.stringify(j))) render(j, false);
      return j;
    });
  }
  function expire(action, data) { var c = S.cache[action + JSON.stringify(data || {})]; if (c) c.t = 0; }
  function fail(e) { toast((e && e.message) || 'សូមអភ័យទោស ប្រព័ន្ធមានជួបបញ្ហាបច្ចេកទេស សូមព្យាយាមម្តងទៀត។'); }
  function busy(btn, on) { if (!btn) return; btn.disabled = on; if (on) { btn.dataset.t = btn.innerHTML; btn.innerHTML = '<span class="spin"></span>'; } else if (btn.dataset.t) btn.innerHTML = btn.dataset.t; }

  var STORE_ST = { Active: ['Active', 'c-ok'], Pending: ['រង់ចាំ', 'c-warn'], Inactive: ['បិទ', 'c-mute'] };
  var BC_ST = { Suggested: ['Bot ណែនាំ', 'c-acc'], Draft: ['ព្រាង', 'c-mute'], Pending_Approval: ['រង់ចាំអនុម័ត', 'c-warn'], Approved: ['អនុម័ត · រង់ចាំផ្ញើ', 'c-info'],
    Sending: ['កំពុងផ្ញើ', 'c-info'], Sent: ['បានផ្ញើ', 'c-ok'], Rejected: ['បដិសេធ', 'c-bad'], Cancelled: ['បោះបង់', 'c-mute'] };
  var BC_TYPE = { new_product: '🆕 ផលិតផលថ្មី', promotion: '🎁 ប្រូម៉ូសិន', discount: '🏷 បញ្ចុះតម្លៃ', restock: '📦 ចូលស្តុកវិញ', new_customer: '🤝 ហាងថ្មី',
    follow_up: '💬 តាមដាន', seasonal: '🎉 រដូវកាល', appreciation: '🙏 អំណរគុណ', notice: '📢 ជូនដំណឹង', reorder: '🔔 រំលឹក Order' };
  var STK = { OK: ['ធម្មតា', 'c-ok'], DUE: ['ជិតដល់', 'c-warn'], OVERDUE: ['យឺត', 'c-bad'], LOW: ['ជិតអស់', 'c-bad'], NO_SALES: ['មិនមានលក់', 'c-mute'], UNTRACKED: ['មិនតាមដាន', 'c-mute'] };
  var PO_ST = { Draft: ['Draft', 'c-warn'], Approved: ['អនុម័ត', 'c-info'], Received: ['បានទទួល', 'c-ok'], Cancelled: ['បោះបង់', 'c-mute'] };
  function chip(map, k) { var x = map[k] || [k || '-', 'c-mute']; return '<span class="chip ' + x[1] + '">' + esc(x[0]) + '</span>'; }

  /* ----------------------------- auth ----------------------------- */
  function showOnly(id) { ['vLogin', 'vPin', 'vApp'].forEach(function (v) { $(v).hidden = v !== id; }); }
  function showPin() { showOnly('vPin'); $('pErr').textContent = ''; $('fPin').reset(); }

  $('fLogin').onsubmit = function (e) {
    e.preventDefault();
    $('lErr').textContent = '';
    var btn = $('lBtn'); busy(btn, true);
    api('adm.login', { system_id: $('lSid').value.trim().toUpperCase(), pin: $('lPin').value.trim() }).then(function (j) {
      busy(btn, false);
      if (!j.ok) { $('lErr').textContent = j.message || 'មិនអាចចូលបាន'; return; }
      S.token = j.token; S.user = j.user; store('lk_token', j.token);
      $('fLogin').reset();
      if (j.user.must_change) showPin(); else enterApp();
    }).catch(function (err) { busy(btn, false); $('lErr').textContent = err.message; });
  };
  $('fPin').onsubmit = function (e) {
    e.preventDefault();
    var n1 = $('pNew').value, n2 = $('pNew2').value;

      '<div style="width:170px"><label class="f">កាលបរិច្ឆេទ</label><input type="date" id="oDate" value="' + today() + '" max="' + today() + '"></div></div>' +

      '<button class="btn sm ghost" id="oAdd">+ បន្ថែមមុខ</button>' +

      '<div class="row" style="margin-top:14px"><div class="grow total" id="oTotal">$0.00</div><button class="btn" id="oSave">✅ រក្សាទុក Order</button></div></div>' +
      '<div class="card"><div class="row"><h3 class="grow" style="margin:0">បញ្ជី Order</h3><input type="date" id="lFrom" style="width:auto" value="' + addDays(today(), -30) + '"><input type="date" id="lTo" style="width:auto" value="' + today() + '"><button class="btn sm ghost" id="lGo">បង្ហាញ</button></div><div class="scroll" id="oList" style="margin-top:10px"></div></div>';
    function drawLines() {

          '<input data-i="' + i + '" data-k="price" type="number" min="0" step="0.01" placeholder="តម្លៃ" value="' + esc(l.price) + '"><button class="x" data-del="' + i + '">✕</button></div>';

    var ps = d ? (d.product_ids || []).map(prodById).filter(Boolean) : [];

    var used = (t.match(/\{(\w+)\}/g) || []).map(function (m) { return m.slice(1, -1); });
    var bad = used.filter(function (k) { return VARS.indexOf(k) < 0; });
    if (bad.length) return 'អថេរមិនស្គាល់: {' + bad.join('}, {') + '}';

    $('hProd').oninput = function () { F.product = this.value; re(); };

    $('hSt').onchange = function () { F.status = this.value; re(); };
    if ($('hSender')) $('hSender').onchange = function () { F.sender = this.value; re(); };
    if ($('hFrom')) { $('hFrom').onchange = function () { F.from = this.value; re(); }; $('hTo').onchange = function () { F.to = this.value; re(); }; }
    $('hX').onclick = function () {
      var b = this; busy(b, true);
      api('adm.history.excel', query()).then(function (j) { busy(b, false); if (!j.ok) return toast(j.message); downloadB64(j.name, j.mime, j.base64); toast('✅ ' + j.rows + ' ជួរ'); }).catch(function (e) { busy(b, false); fail(e); });
    };
    function query() {
      var q = { period: F.period, sender: F.sender, province: F.province, status: F.status, product: F.product, q: F.q, page: F.page };
      if (F.period === 'custom') { q.from = F.from || addDays(today(), -30); q.to = F.to || today(); }
      return q;
    }
    S.refresh = function () { expire('adm.history.list', query()); load(); };
    function load() {
      return swr('adm.history.list', query(), function (j) {
        if (!$('hTbl')) return;
        var added = false;
        j.rows.forEach(function (r) { if (r.sender_id && !S.hSenders[r.sender_id]) { S.hSenders[r.sender_id] = r.sender_name; added = true; } });
        if (added) senders();
        $('hCounts').innerHTML = '<span class="chip c-ok">✅ ' + j.counts.OK + '</span> <span class="chip c-bad">❌ ' + j.counts.FAIL + '</span> <span class="chip c-warn">⏳ ' + j.counts.PENDING + '</span> <span class="hint">· សរុប ' + j.total + ' ជួរ</span>';
        $('hTbl').innerHTML = j.rows.length ? '<table class="tbl"><tr><th>ពេលវេលា</th><th>សារ</th><th>អ្នកផ្ញើ</th><th>ប្រភេទ</th><th>ហាង</th><th>ខេត្ត</th><th>ផលិតផល</th><th>ស្ថានភាព</th></tr>' +
          j.rows.map(function (r) {
            return '<tr class="click" data-bc="' + esc(r.broadcast_id) + '"><td style="white-space:nowrap">' + esc(r.date_time.slice(5, 16)) + '</td><td>' + esc(r.broadcast_id) + '<div class="hint" style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(r.text) + '</div></td>' +
              '<td>' + esc(r.sender_name) + '<div class="hint">' + (r.sender_role === 'SALE' ? 'Sale' : 'Admin') + '</div></td><td>' + (BC_TYPE[r.type] || esc(r.type)) + '</td><td>' + esc(r.store_name) + '</td><td>' + esc(r.province || '—') + '</td>' +
              '<td style="max-width:180px">' + esc(r.product_names || '—') + '</td><td>' + chip(H_ST, r.status) + (r.error ? '<div class="hint" style="max-width:200px">' + esc(r.error) + '</div>' : '') + '</td></tr>';
          }).join('') + '</table>' : '<div class="empty">មិនមានសារក្នុងរយៈពេលនេះ</div>';
        Array.prototype.forEach.call($('hTbl').querySelectorAll('tr[data-bc]'), function (tr) { tr.onclick = function () { historyDetail(tr.dataset.bc); }; });
        $('hPager').innerHTML = j.pages > 1 ? '<button class="btn sm ghost" id="hPrev"' + (j.page <= 1 ? ' disabled' : '') + '>‹ មុន</button><span class="hint">ទំព័រ ' + j.page + ' / ' + j.pages + '</span><button class="btn sm ghost" id="hNext"' + (j.page >= j.pages ? ' disabled' : '') + '>បន្ទាប់ ›</button>' : '';
        if ($('hPrev')) { $('hPrev').onclick = function () { F.page--; load(); }; $('hNext').onclick = function () { F.page++; load(); }; }
      }).catch(fail);
    }
    load();
  }
  function historyDetail(id) {
    modal('<div class="empty"><span class="spin"></span></div>');
    api('adm.history.detail', { broadcast_id: id }).then(function (j) {
      if (!j.ok) { closeModal(); return toast(j.message); }
      var b = j.broadcast, fails = j.rows.filter(function (r) { return r.status === 'FAIL'; }).length;
      var canCancel = b.status === 'Approved' || b.status === 'Pending_Approval';
      modal('<div class="row"><h3 class="grow">' + esc(b.broadcast_id) + '</h3>' + chip(BC_ST, b.status) + '</div><div class="hint">' + (BC_TYPE[b.type] || esc(b.type)) + ' · ពី ' + esc(b.sender) + (b.approved_by ? ' · អនុម័ត/ផ្ញើដោយ ' + esc(b.approved_by) : '') + ' · ' + esc(b.created_at.slice(0, 16)) + '</div>' +
        (b.products.length ? '<div class="hint">🛍 ' + esc(b.products.join(', ')) + '</div>' : '') + (b.promotion ? '<div class="hint">🎁 ' + esc(b.promotion) + '</div>' : '') +
        '<label class="f">សារដើម</label><div class="prev">' + esc(b.text) + '</div><label class="f">ឧទាហរណ៍សារដែលហាងទទួល' + (b.media_count ? ' · រូប ' + b.media_count : '') + '</label><div class="prev">' + esc(b.preview) + '</div>' +
        '<label class="f">លទ្ធផលតាម Group (' + j.rows.length + ')</label><div class="scroll" style="max-height:260px"><table class="tbl">' + j.rows.map(function (r) {
          return '<tr><td>' + esc(r.store_name) + '<div class="hint">' + esc(r.province) + '</div></td><td>' + chip(H_ST, r.status) + (r.error ? '<div class="hint">' + esc(r.error) + '</div>' : '') + '</td><td class="hint" style="white-space:nowrap">' + esc(r.date_time.slice(11, 16)) + '</td></tr>';
        }).join('') + '</table></div>' +
        '<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" id="hdC">បិទ</button>' + (canCancel ? '<button class="btn bad" id="hdX">✋ បោះបង់សារ</button>' : '') + (fails && b.status === 'Sent' ? '<button class="btn" id="hdR">🔁 ផ្ញើម្តងទៀតទៅ ' + fails + ' Group បរាជ័យ</button>' : '') + '</div>', function () {
        $('hdC').onclick = closeModal;
        if ($('hdX')) $('hdX').onclick = function () { api('adm.bc.cancel', { broadcast_id: id }).then(function (r) { toast(r.ok ? '✋ បានបោះបង់' : r.message); closeModal(); if (S.refresh) S.refresh(); }).catch(fail); };
        if ($('hdR')) $('hdR').onclick = function () {
          var btn = this; busy(btn, true);
          api('adm.bc.retry', { broadcast_id: id }).then(function (r) {
            busy(btn, false); if (!r.ok) return toast(r.message);
            closeModal(); if (r.cancel_until) S.pendingCancel = { id: r.broadcast_id, n: r.target_count, until: Date.now() + 60000, inHours: r.in_hours };
            toast(r.status === 'Approved' ? '🔁 ' + r.broadcast_id + ' នឹងផ្ញើក្នុង 60 វិនាទី' : '⏳ បានស្នើ Admin អនុម័ត'); if (S.view === 'broadcast') go('broadcast');
          }).catch(function (e) { busy(btn, false); fail(e); });
        };
      });
    }).catch(function (e) { closeModal(); fail(e); });
  }
  function downloadB64(name, mime, b64) {
    var bin = atob(b64), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([arr], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  }

  /* ----------------------------- reports ----------------------------- */
  function vReports(m) {
    m.innerHTML = '<h2>របាយការណ៍ Excel</h2><div class="card"><div class="row"><div class="grow"><label class="f">រយៈពេល</label><select id="rP"><option value="today">ថ្ងៃនេះ</option><option value="week">7 ថ្ងៃចុងក្រោយ</option><option value="month" selected>ខែនេះ</option><option value="lastweek">សប្តាហ៍មុន</option><option value="lastmonth">ខែមុន</option><option value="custom">កំណត់ខ្លួនឯង</option></select></div>' +
      '<div class="grow" id="rC" hidden><label class="f">ពី · ដល់</label><div class="row"><input type="date" id="rF" value="' + addDays(today(), -30) + '" class="grow"><input type="date" id="rT" value="' + today() + '" class="grow"></div></div></div>' +
      '<p class="hint">File មាន Sheet: សង្ខេប · Orders · តាមហាង · តាមផលិតផល · តាម Sale · ស្តុកជិតអស់ · Broadcast' + (isAdmin() ? '' : ' (តែហាងរបស់អ្នក)') + '។ ក្នុង Telegram អាចវាយ <b>/excel week</b> បានដែរ។ Bot ផ្ញើរបាយការណ៍សប្តាហ៍មុនរៀងរាល់ថ្ងៃច័ន្ទ និងខែមុនរៀងរាល់ថ្ងៃទី ១ ទៅ Group Admin ដោយស្វ័យប្រវត្តិ។</p>' +
      '<button class="btn" id="rGo">⬇️ ទាញយក Excel</button><div class="hint" id="rMsg" style="margin-top:10px"></div></div>';
    $('rP').onchange = function () { $('rC').hidden = this.value !== 'custom'; };
    $('rGo').onclick = function () {
      var b = this; busy(b, true); $('rMsg').textContent = 'កំពុងរៀបចំ... (10–30 វិនាទី)';
      api('adm.report.excel', { period: $('rP').value, from: $('rF').value, to: $('rT').value }).then(function (j) {
        busy(b, false);
        if (!j.ok) { $('rMsg').textContent = j.message; return; }
        downloadB64(j.name, j.mime, j.base64);
        $('rMsg').textContent = '✅ ' + j.name + ' · Order ' + j.orders + ' · ' + money(j.total);
      }).catch(function (e) { busy(b, false); $('rMsg').textContent = ''; fail(e); });
    };
  }

  /* ----------------------------- users ----------------------------- */
  function vUsers(m) {
    if (!isAdmin()) return vOverview(m);
    swr('adm.users.list', {}, function (j) {
      m.innerHTML = '<h2>អ្នកប្រើ</h2><div class="card"><div class="row"><p class="hint grow" style="margin:0">Sale ចូល Dashboard ដោយ System ID + PIN។ ដើម្បីទទួលសាររំលឹក និង /excel ក្នុង Telegram Sale ត្រូវផ្ញើ <b>/start</b> ទៅ Bot ហើយវាយ <b>/myid</b> ដើម្បីដឹង Telegram User ID។</p><button class="btn" id="uAdd">+ អ្នកប្រើ</button></div>' +
        '<div class="scroll"><table class="tbl" style="margin-top:10px"><tr><th>System ID</th><th>ឈ្មោះ</th><th>តួនាទី</th><th>ផ្ញើសារ</th><th>Telegram ID</th><th>ស្ថានភាព</th><th>ចូលចុងក្រោយ</th><th></th></tr>' +
        j.users.map(function (u) {
          return '<tr><td><b>' + esc(u.system_id) + '</b></td><td>' + esc(u.name) + '</td><td>' + (u.role === 'ADMIN' ? '<span class="chip c-acc">Admin</span>' : '<span class="chip c-info">Sale</span>') + '</td><td>' +
            (u.role === 'ADMIN' ? '<span class="hint">ទាំងអស់</span>' : u.can_send_direct ? '<span class="chip c-ok">ផ្ញើផ្ទាល់</span><div class="hint">≤ ' + (u.daily_group_limit || 'លំនាំដើម') + ' Group/ថ្ងៃ</div>' : '<span class="chip c-warn">ត្រូវអនុម័ត</span>') +
            '</td><td>' + esc(u.telegram_user_id || '—') + '</td><td>' +
            (u.status === 'Active' ? '<span class="chip c-ok">Active</span>' : '<span class="chip c-mute">បិទ</span>') + (u.must_change ? ' <span class="chip c-warn">ត្រូវប្តូរ PIN</span>' : '') + (u.locked_until && u.locked_until > '' ? ' <span class="hint">ចាក់សោដល់ ' + esc(u.locked_until.slice(11, 16)) + '</span>' : '') +
            '</td><td class="hint">' + esc(u.last_login || '—') + '</td><td class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-e="' + esc(u.system_id) + '">កែ</button><button class="btn sm ghost" data-r="' + esc(u.system_id) + '">Reset PIN</button></td></tr>';
        }).join('') + '</table></div></div>';
      $('uAdd').onclick = function () { editUser(null); };
      Array.prototype.forEach.call(m.querySelectorAll('[data-e]'), function (b) { b.onclick = function () { editUser(j.users.filter(function (u) { return u.system_id === b.dataset.e; })[0]); }; });
      Array.prototype.forEach.call(m.querySelectorAll('[data-r]'), function (b) {
        b.onclick = function () {
          if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'បញ្ជាក់ Reset?'; return; }
          api('adm.users.resetPin', { system_id: b.dataset.r }).then(function (r) { if (!r.ok) return toast(r.message); showPinResult(r.system_id, r.pin); }).catch(fail);
        };
      });
    }).catch(fail);
  }
  function showPinResult(sid, pin) {
    modal('<h3>PIN បណ្តោះអាសន្ន — ' + esc(sid) + '</h3><div class="hint">សូមផ្ញើ System ID និង PIN នេះទៅអ្នកប្រើដោយផ្ទាល់ (កុំផ្ញើក្នុង Group)។ ពួកគេត្រូវប្តូរ PIN ពេលចូលលើកដំបូង។ PIN នេះនឹងមិនបង្ហាញម្តងទៀតទេ។</div><div class="pinbox">' + esc(pin) + '</div><div class="row" style="justify-content:flex-end"><button class="btn" id="pOk">រួចរាល់</button></div>', function () {
      $('pOk').onclick = function () { closeModal(); go('users'); };
    });
  }
  function editUser(u) {
    u = u || { system_id: '', name: '', role: 'SALE', telegram_user_id: '', status: 'Active', can_send_direct: false, daily_group_limit: '', contact_phone: '' };
    modal('<h3>' + (u.system_id ? 'កែ ' + esc(u.system_id) : 'អ្នកប្រើថ្មី') + '</h3><label class="f">ឈ្មោះ *</label><input id="uName" value="' + esc(u.name) + '">' +
      '<label class="f">តួនាទី</label><select id="uRole"><option value="SALE">Sale</option><option value="ADMIN">Admin</option></select>' +
      '<label class="f">Telegram User ID (ជម្រើស — សម្រាប់សាររំលឹក និង /excel)</label><input id="uTg" inputmode="numeric" value="' + esc(u.telegram_user_id) + '" placeholder="ឧ. 7745291138">' +
      '<label class="f">លេខទូរស័ព្ទ (សម្រាប់ {{Contact_Number}})</label><input id="uPh" value="' + esc(u.contact_phone || '') + '" placeholder="ឧ. 012 345 678">' +
      '<div id="uSaleBox"><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="uDir" style="width:auto"' + (u.can_send_direct && u.role !== 'ADMIN' ? ' checked' : '') + '> ✅ អនុញ្ញាតឲ្យផ្ញើសារទៅ Group ហាងរបស់ខ្លួនដោយផ្ទាល់ (មិនបាច់ Admin អនុម័ត)</label>' +
      '<label class="f">ចំនួន Group អតិបរមា/ថ្ងៃ (ទទេ = លំនាំដើម 300)</label><input id="uLim" type="number" min="0" max="5000" value="' + esc(u.daily_group_limit || '') + '"></div>' +
      (u.system_id ? '<label class="f">ស្ថានភាព</label><select id="uSt"><option value="Active">Active</option><option value="Disabled">បិទ (ចាកចេញភ្លាម)</option></select>' : '') +
      '<div class="err" id="uErr"></div><div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" id="uC">បិទ</button><button class="btn" id="uS">រក្សាទុក</button></div>', function () {
      $('uRole').value = u.role; if ($('uSt')) $('uSt').value = u.status;
      var roleBox = function () { $('uSaleBox').hidden = $('uRole').value !== 'SALE'; }; $('uRole').onchange = roleBox; roleBox();
      $('uC').onclick = closeModal;
      $('uS').onclick = function () {
        var b = this; busy(b, true);
        api('adm.users.save', { system_id: u.system_id, name: $('uName').value, role: $('uRole').value, telegram_user_id: $('uTg').value, status: $('uSt') ? $('uSt').value : 'Active',
          contact_phone: $('uPh').value, can_send_direct: $('uDir').checked, daily_group_limit: $('uLim').value }).then(function (r) {
          busy(b, false);
          if (!r.ok) { $('uErr').textContent = r.message; return; }
          if (r.pin) showPinResult(r.system_id, r.pin); else { closeModal(); toast('✅ បានរក្សាទុក'); go('users'); }
          reloadStores().catch(function () {});
        }).catch(function (e) { busy(b, false); fail(e); });
      };
    });
  }

  /* ----------------------------- account ----------------------------- */
  function vAccount(m) {
    m.innerHTML = '<h2>PIN របស់ខ្ញុំ</h2><div class="card" style="max-width:420px"><div class="hint">' + esc(S.user.name) + ' · ' + esc(S.user.system_id) + '</div>' +
      '<label class="f">PIN បច្ចុប្បន្ន</label><input id="aOld" type="password" inputmode="numeric" maxlength="6"><label class="f">PIN ថ្មី</label><input id="aNew" type="password" inputmode="numeric" maxlength="6">' +
      '<label class="f">បញ្ជាក់ PIN ថ្មី</label><input id="aNew2" type="password" inputmode="numeric" maxlength="6"><div class="err" id="aErr"></div><div style="height:12px"></div><button class="btn" id="aGo">ប្តូរ PIN</button>' +
      '<p class="hint">ប្តូរ PIN នឹងចាកចេញពីឧបករណ៍ផ្សេងទៀតទាំងអស់។</p></div>';
    $('aGo').onclick = function () {
      if ($('aNew').value !== $('aNew2').value) { $('aErr').textContent = 'PIN ថ្មីទាំងពីរមិនដូចគ្នា'; return; }
      api('adm.changePin', { old_pin: $('aOld').value, new_pin: $('aNew').value }).then(function (r) {
        if (!r.ok) { $('aErr').textContent = r.message; return; }
        toast('✅ បានប្តូរ PIN'); go('overview');
      }).catch(fail);
    };
  }

  /* ----------------------------- boot ----------------------------- */
  var saved = store('lk_token');
  if (saved && /^[a-f0-9]{64}$/.test(saved)) {
    S.token = saved;
    api('adm.me').then(function (j) { S.user = j.user; if (j.user.must_change) showPin(); else enterApp(); }).catch(function () { showOnly('vLogin'); });
  } else {
    showOnly('vLogin');
  }
})();
</script>
</body>
